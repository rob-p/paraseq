[package]
# Republication of upstream paraseq. Not a fork with independent intent: it
# exists only to unblock dependents that need features not yet merged upstream.
# `paraseq` is the official crate; see README.md.
name = "paraseq-temp"
version = "0.5.0-pre.2"
edition = "2021"
authors = ["Noam Teyssier", "Rob Patro"]
keywords = ["fasta", "fastq", "parser", "parallel", "paired"]
license = "MIT"
repository = "https://github.com/rob-p/paraseq"
description = "Republication of paraseq 0.5.0 plus a resizable worker pool (noamteyssier/paraseq#78), to unblock dependents needing the pool before it lands upstream. `paraseq` is the official crate; prefer it for everything the pool does not require."
readme = "README.md"
documentation = "https://docs.rs/paraseq-temp"

# Keep the crate importable as `paraseq`, so downstream code and the eventual
# switch back to upstream need no source changes.
[lib]
name = "paraseq"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0.95", optional = true }
crossbeam-channel = "0.5.14"
either = "1.15.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.29"
memchr = "2.7.4"
niffler = { version = "3.0.0", optional = true, default-features = false }
num_cpus = "1.17.0"
parking_lot = "0.12.3"
reqwest = { version = "0.12.22", optional = true, features = ["blocking"] }
rust-htslib = { version = "0.49.0", default-features = false, optional = true }
smallvec = "1.15.1"
thiserror = "2.0.11"
which = { version = "8.0.0", optional = true }

[features]
default = ["anyhow", "niffler", "niffler/default"]
anyhow = ["dep:anyhow"]
niffler = ["dep:niffler"]
htslib = ["dep:rust-htslib"]
url = ["dep:reqwest", "dep:niffler"]
ssh = ["dep:which"]
gcs = ["dep:which"]

[dev-dependencies]
clap = { version = "4.5.40", features = ["derive"] }
niffler = "3.0.0"

[[example]]
name = "htslib"
required-features = ["htslib"]

[[example]]
name = "url"
required-features = ["url"]

[[example]]
name = "ssh"
required-features = ["ssh"]

[[example]]
name = "gcs"
required-features = ["gcs"]
