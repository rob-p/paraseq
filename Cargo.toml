[package]
# TEMPORARY republication of upstream paraseq. Not a fork with independent
# intent: see README.md. Depend on `paraseq` itself as soon as 0.5.0 ships.
name = "paraseq-temp"
version = "0.5.0-pre.1"
edition = "2021"
authors = ["Noam Teyssier", "Rob Patro"]
keywords = ["fasta", "fastq", "parser", "parallel", "paired"]
license = "MIT"
repository = "https://github.com/rob-p/paraseq"
description = "Temporary republication of paraseq's unreleased dev-0.5.0 branch plus a resizable worker pool (noamteyssier/paraseq#75). Use `paraseq` instead once 0.5.0 is released; this crate will be yanked."
readme = "README.md"
documentation = "https://docs.rs/paraseq-temp"

# Keep the crate importable as `paraseq`, so downstream code and the eventual
# switch back to upstream need no source changes.
[lib]
name = "paraseq"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0.95", optional = true }
crossbeam-channel = "0.5.14"
either = "1.15.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.29"
memchr = "2.7.4"
niffler = { version = "3.0.0", optional = true, default-features = false }
num_cpus = "1.17.0"
parking_lot = "0.12.3"
reqwest = { version = "0.12.22", optional = true, features = ["blocking"] }
rust-htslib = { version = "0.49.0", default-features = false, optional = true }
smallvec = "1.15.1"
thiserror = "2.0.11"
which = { version = "8.0.0", optional = true }

[features]
default = ["anyhow", "niffler", "niffler/default"]
anyhow = ["dep:anyhow"]
niffler = ["dep:niffler"]
htslib = ["dep:rust-htslib"]
url = ["dep:reqwest", "dep:niffler"]
ssh = ["dep:which"]
gcs = ["dep:which"]

[dev-dependencies]
clap = { version = "4.5.40", features = ["derive"] }
niffler = "3.0.0"
paraseq-temp = { path = ".", features = ["url", "ssh", "gcs"] }

[[example]]
name = "htslib"
required-features = ["htslib"]
